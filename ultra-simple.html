<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>
<body>
    <h2>Login Test</h2>
    
    <div>
        <input type="text" id="user" value="admin" placeholder="Username">
    </div>
    <div style="margin-top: 10px;">
        <input type="password" id="pass" value="admin123" placeholder="Password">
    </div>
    <div style="margin-top: 10px;">
        <button onclick="doLogin()">Login</button>
    </div>
    <div id="result" style="margin-top: 20px; padding: 10px; background: #eee;"></div>

    <script>
        async function doLogin() {
            const result = document.getElementById('result');
            result.innerHTML = 'Trying to login...';
            result.style.background = '#eee';
            
            try {
                // Try localhost first
                result.innerHTML += '<br>📡 Connecting to localhost...';
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('user').value,
                        password: document.getElementById('pass').value
                    })
                });
                
                result.innerHTML += '<br>✅ Response received! Status: ' + response.status;
                
                const data = await response.json();
                result.innerHTML += '<br>📦 Data: ' + JSON.stringify(data);
                
                if (response.ok) {
                    result.style.background = '#cfc';
                    result.innerHTML += '<br>🎉 SUCCESS! Login worked!';
                } else {
                    result.style.background = '#fcc';
                    result.innerHTML += '<br>❌ Login failed: ' + (data.error || 'Unknown error');
                }
                
            } catch (error) {
                result.style.background = '#fcc';
                result.innerHTML += '<br>❌ ERROR: ' + error.message;
                result.innerHTML += '<br><br>🔍 Make sure backend is running on port 3000';
            }
        }
    </script>
</body>
</html>
