<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rollcall Scanner - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #0a0f1f; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="background: #141b2b; padding: 2rem; border-radius: 10px; width: 100%; max-width: 400px;">
        <h2 style="color: white; text-align: center; margin-bottom: 2rem;">Rollcall Scanner</h2>
        
        <div id="errorMsg" style="color: #ff1744; background: rgba(255,23,68,0.1); padding: 10px; border-radius: 5px; margin-bottom: 1rem; display: none;"></div>
        
        <form id="loginForm">
            <div style="margin-bottom: 1rem;">
                <input type="text" id="username" value="admin" style="width: 100%; padding: 10px; background: #1e2740; border: 1px solid #2a3442; color: white; border-radius: 5px;" placeholder="Username">
            </div>
            <div style="margin-bottom: 1rem;">
                <input type="password" id="password" value="admin123" style="width: 100%; padding: 10px; background: #1e2740; border: 1px solid #2a3442; color: white; border-radius: 5px;" placeholder="Password">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background: #00f2fe; border: none; border-radius: 5px; color: #0a0f1f; font-weight: bold; cursor: pointer;">Login</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'https://rollcall-backend.onrender.com/api';
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                    document.getElementById('errorMsg').textContent = data.error || 'Login failed';
                }
            } catch (error) {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = 'Connection error';
            }
        });
    </script>
</body>
</html>
