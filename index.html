<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rollcall Scanner - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Load jQuery FIRST -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
</head>
<body>
    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        
        // Check authentication
        fetch(`${API_BASE_URL}/check-auth`, {
            credentials: 'include'
        })
        .then(response => response.json())
        .then(data => {
            if (!data.loggedIn) {
                window.location.href = 'login.html';
            }
        })
        .catch(() => {
            window.location.href = 'login.html';
        });
    </script>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-qrcode me-2"></i>
                Rollcall Scanner
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Attendance</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">
            <i class="fas fa-crown me-2" style="color: #ffea00;"></i>
            Admin Dashboard
        </h2>
        
        <!-- Stats Cards -->
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body">
                        <h6 class="text-muted">Total Students</h6>
                        <h2 class="stat-number" id="totalStudents">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body">
                        <h6 class="text-muted">Present Today</h6>
                        <h2 class="stat-number" id="presentToday">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body">
                        <h6 class="text-muted">Absent Today</h6>
                        <h2 class="stat-number" id="absentToday">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body">
                        <h6 class="text-muted">5+ Day Absences</h6>
                        <h2 class="stat-number" id="longAbsences">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="card mt-4">
            <div class="card-header">
                <i class="fas fa-sliders-h me-2" style="color: #00f2fe;"></i>
                System Settings
            </div>
            <div class="card-body">
                <form id="settingsForm">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="notifications_enabled">
                                <label class="form-check-label" for="notifications_enabled">
                                    <i class="fas fa-bell me-1"></i>Email Notifications
                                </label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="weekend_off">
                                <label class="form-check-label" for="weekend_off">
                                    <i class="fas fa-calendar-week me-1"></i>Weekends Off
                                </label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="holiday_off">
                                <label class="form-check-label" for="holiday_off">
                                    <i class="fas fa-gift me-1"></i>Holidays Off
                                </label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-save me-2"></i>Save Settings
                            </button>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label for="email_recipient" class="form-label">
                                <i class="fas fa-envelope me-2"></i>Alert Email:
                            </label>
                            <input type="email" class="form-control" id="email_recipient" placeholder="admin@school.edu">
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Student Management -->
        <div class="card mt-4">
            <div class="card-header">
                <i class="fas fa-user-graduate me-2"></i>
                Student Management
            </div>
            <div class="card-body">
                <form id="studentForm" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="ic_number" placeholder="IC Number" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="student_id" placeholder="Student ID" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="student_name" placeholder="Student Name" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Add Student</button>
                    </div>
                </form>
                
                <div class="table-responsive mt-4">
                    <table id="studentsTable" class="table">
                        <thead>
                            <tr>
                                <th>IC Number</th>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Registered</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Holiday Management -->
        <div class="card mt-4">
            <div class="card-header">
                <i class="fas fa-calendar-alt me-2"></i>
                Holiday Management
            </div>
            <div class="card-body">
                <form id="holidayForm" class="row g-3">
                    <div class="col-md-4">
                        <input type="date" class="form-control" id="holiday_date" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="holiday_description" placeholder="Description" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-warning w-100">Add Holiday</button>
                    </div>
                </form>
                
                <div class="table-responsive mt-4">
                    <table id="holidaysTable" class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <script>
        // Logout function
        $('#logoutBtn').click(function(e) {
            e.preventDefault();
            $.ajax({
                url: `${API_BASE_URL}/logout`,
                method: 'POST',
                xhrFields: { withCredentials: true },
                success: function() {
                    window.location.href = 'login.html';
                }
            });
        });

        // Load dashboard statistics
        function loadDashboardStats() {
            $.ajax({
                url: `${API_BASE_URL}/students`,
                method: 'GET',
                xhrFields: { withCredentials: true },
                success: function(students) {
                    $('#totalStudents').text(students.length);
                }
            });
            
            const today = new Date().toISOString().split('T')[0];
            $.ajax({
                url: `${API_BASE_URL}/attendance?start_date=${today}&end_date=${today}`,
                method: 'GET',
                xhrFields: { withCredentials: true },
                success: function(attendance) {
                    $('#presentToday').text(attendance.length);
                    
                    $.ajax({
                        url: `${API_BASE_URL}/students`,
                        method: 'GET',
                        xhrFields: { withCredentials: true },
                        success: function(students) {
                            $('#absentToday').text(students.length - attendance.length);
                        }
                    });
                }
            });
        }

        // Load students
        function loadStudents() {
            $.ajax({
                url: `${API_BASE_URL}/students`,
                method: 'GET',
                xhrFields: { withCredentials: true },
                success: function(students) {
                    const tbody = $('#studentsTable tbody');
                    tbody.empty();
                    
                    students.forEach(student => {
                        tbody.append(`
                            <tr>
                                <td>${student.ic_number}</td>
                                <td>${student.student_id}</td>
                                <td>${student.student_name}</td>
                                <td>${new Date(student.created_at).toLocaleDateString()}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-danger delete-student" data-id="${student.id}">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `);
                    });
                    
                    $('.delete-student').click(function() {
                        const id = $(this).data('id');
                        if (confirm('Delete this student?')) {
                            $.ajax({
                                url: `${API_BASE_URL}/students/${id}`,
                                method: 'DELETE',
                                xhrFields: { withCredentials: true },
                                success: function() {
                                    loadStudents();
                                    loadDashboardStats();
                                    showNotification('Student deleted', 'success');
                                }
                            });
                        }
                    });
                }
            });
        }

        // Load settings
        function loadSettings() {
            $.ajax({
                url: `${API_BASE_URL}/settings`,
                method: 'GET',
                xhrFields: { withCredentials: true },
                success: function(settings) {
                    settings.forEach(setting => {
                        const el = $(`#${setting.setting_key}`);
                        if (el.length) {
                            if (el.is(':checkbox')) {
                                el.prop('checked', setting.setting_value === 'true');
                            } else {
                                el.val(setting.setting_value);
                            }
                        }
                    });
                }
            });
        }

        // Update settings
        $('#settingsForm').submit(function(e) {
            e.preventDefault();
            
            const settings = {
                notifications_enabled: $('#notifications_enabled').is(':checked') ? 'true' : 'false',
                weekend_off: $('#weekend_off').is(':checked') ? 'true' : 'false',
                holiday_off: $('#holiday_off').is(':checked') ? 'true' : 'false',
                email_recipient: $('#email_recipient').val()
            };
            
            $.ajax({
                url: `${API_BASE_URL}/settings`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(settings),
                xhrFields: { withCredentials: true },
                success: function() {
                    showNotification('Settings saved', 'success');
                },
                error: function() {
                    showNotification('Error saving settings', 'danger');
                }
            });
        });

        // Load holidays
        function loadHolidays() {
            $.ajax({
                url: `${API_BASE_URL}/holidays`,
                method: 'GET',
                xhrFields: { withCredentials: true },
                success: function(holidays) {
                    const tbody = $('#holidaysTable tbody');
                    tbody.empty();
                    
                    holidays.forEach(holiday => {
                        tbody.append(`
                            <tr>
                                <td>${new Date(holiday.holiday_date).toLocaleDateString()}</td>
                                <td>${holiday.description}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-danger delete-holiday" data-id="${holiday.id}">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `);
                    });
                }
            });
        }

        // Add holiday
        $('#holidayForm').submit(function(e) {
            e.preventDefault();
            
            const holiday = {
                holiday_date: $('#holiday_date').val(),
                description: $('#holiday_description').val()
            };
            
            $.ajax({
                url: `${API_BASE_URL}/holidays`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(holiday),
                xhrFields: { withCredentials: true },
                success: function() {
                    $('#holidayForm')[0].reset();
                    loadHolidays();
                    showNotification('Holiday added', 'success');
                }
            });
        });

        // Add student
        $('#studentForm').submit(function(e) {
            e.preventDefault();
            
            const student = {
                ic_number: $('#ic_number').val(),
                student_id: $('#student_id').val(),
                student_name: $('#student_name').val()
            };
            
            $.ajax({
                url: `${API_BASE_URL}/students`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(student),
                xhrFields: { withCredentials: true },
                success: function() {
                    $('#studentForm')[0].reset();
                    loadStudents();
                    loadDashboardStats();
                    showNotification('Student added', 'success');
                }
            });
        });

        // Show notification
        function showNotification(message, type) {
            const toast = $(`
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `);
            
            $('#notification-container').append(toast);
            
            setTimeout(() => {
                toast.fadeOut(() => toast.remove());
            }, 3000);
        }

        // Initialize page
        $(document).ready(function() {
            loadDashboardStats();
            loadStudents();
            loadSettings();
            loadHolidays();
        });
    </script>
</body>
</html>
