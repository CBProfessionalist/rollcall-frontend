<!DOCTYPE html>
<html>
<head>
    <title>Rollcall Login</title>
    <style>
        body {
            background: #0a0f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .login-box {
            background: #141b2b;
            padding: 40px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            border: 1px solid #2a3442;
        }
        h2 {
            color: #00f2fe;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1e2740;
            border: 1px solid #2a3442;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00f2fe;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 5px;
            color: #0a0f1f;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,242,254,0.3);
        }
        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: rgba(0,230,118,0.1);
            color: #00e676;
            border: 1px solid #00e676;
        }
        .error {
            background: rgba(255,23,68,0.1);
            color: #ff1744;
            border: 1px solid #ff1744;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Rollcall Scanner</h2>
        
        <input type="text" id="username" value="admin" placeholder="Username">
        <input type="password" id="password" value="admin123" placeholder="Password">
        
        <button onclick="login()">Login</button>
        
        <div id="message"></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.style.display = 'block';
            messageDiv.className = '';
            messageDiv.innerHTML = '⏳ Logging in...';
            
            try {
                console.log('Sending login request...');
                
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    messageDiv.className = 'success';
                    messageDiv.innerHTML = '✅ Login successful! Redirecting...';
                    
                    // Store user info
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = '❌ ' + (data.error || 'Login failed');
                }
                
            } catch (error) {
                console.error('Error:', error);
                messageDiv.className = 'error';
                messageDiv.innerHTML = '❌ Connection error: ' + error.message;
            }
        }
    </script>
</body>
</html>
